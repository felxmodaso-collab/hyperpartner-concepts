<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>V1 · WebGL+SVG — HyperPartner Hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&family=Inter:wght@200;300;500&family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.158.0/three.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/MotionPathPlugin.min.js" defer></script>
<script src="script.js" defer></script>
</head>
<body>

<!-- LAYER 1: WebGL canvas (left chaos) -->
<canvas id="webgl-bg"></canvas>

<!-- LAYER 2: SVG stage (chevron + curves + particles on curves + labels) -->
<svg class="stage" id="stage" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <!-- Chevron front gradient -->
    <linearGradient id="cv-front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F2C9A5"/>
      <stop offset="100%" stop-color="#E8A878"/>
    </linearGradient>
    <linearGradient id="cv-back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#F4ECDD"/>
    </linearGradient>
    <radialGradient id="cv-halo" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#E8A878" stop-opacity="0.6"/>
      <stop offset="45%" stop-color="#E8A878" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#E8A878" stop-opacity="0"/>
    </radialGradient>
    <filter id="cv-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="cv-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Particle shape sprites for SVG curve particles -->
    <symbol id="p-dot" overlayBox="0 0 6 6"><circle cx="3" cy="3" r="2.4" fill="#F2C9A5"/></symbol>
  </defs>

  <!-- Halo behind chevron -->
  <circle cx="960" cy="540" r="380" fill="url(#cv-halo)" class="halo" id="halo"/>

  <!-- Chevron (back + front) -->
  <g id="chevron" class="chevron">
    <path id="cv-back-path" d="M820 280 L900 280 L1010 540 L900 800 L820 800 L930 540 Z"
          fill="url(#cv-back)" filter="url(#cv-glow)" opacity="0.95"/>
    <path id="cv-front-path" d="M920 280 L1000 280 L1110 540 L1000 800 L920 800 L1030 540 Z"
          fill="url(#cv-front)" filter="url(#cv-glow)"/>
  </g>

  <!-- 10 output curves: from chevron tip (1100,540) to labels stacked vertically -->
  <g id="curves" class="curves" fill="none" stroke="rgba(232,168,120,0.32)" stroke-width="1.2">
    <path id="curve-0" d="M1110 540 C 1280 540, 1380 200, 1640 130"/>
    <path id="curve-1" d="M1110 540 C 1280 540, 1380 250, 1640 220"/>
    <path id="curve-2" d="M1110 540 C 1280 540, 1380 320, 1640 320"/>
    <path id="curve-3" d="M1110 540 C 1280 540, 1380 400, 1640 410"/>
    <path id="curve-4" d="M1110 540 C 1280 540, 1380 480, 1640 490"/>
    <path id="curve-5" d="M1110 540 C 1280 540, 1380 560, 1640 580"/>
    <path id="curve-6" d="M1110 540 C 1280 540, 1380 640, 1640 660"/>
    <path id="curve-7" d="M1110 540 C 1280 540, 1380 720, 1640 750"/>
    <path id="curve-8" d="M1110 540 C 1280 540, 1380 800, 1640 840"/>
    <path id="curve-9" d="M1110 540 C 1280 540, 1380 880, 1640 930"/>
  </g>

  <!-- 10 labels on right edge -->
  <g id="labels" class="labels">
    <g data-i="0" transform="translate(1655, 130)">
      <rect x="0" y="-16" width="92" height="32" rx="16" fill="#0F0F0F" stroke="rgba(244,236,221,0.18)"/>
      <text x="46" y="5" text-anchor="middle" font-family="JetBrains Mono" font-size="11" fill="#F4ECDD" letter-spacing="0.04em">CRM</text>
    </g>
    <g data-i="1" transform="translate(1655, 220)">
      <rect x="0" y="-16" width="92" height="32" rx="16" fill="#0F0F0F" stroke="rgba(244,236,221,0.18)"/>
      <text x="46" y="5" text-anchor="middle" font-family="JetBrains Mono" font-size="11" fill="#F4ECDD" letter-spacing="0.04em">Отчёт</text>
    </g>
    <g data-i="2" transform="translate(1655, 320)">
      <rect x="0" y="-16" width="92" height="32" rx="16" fill="#0F0F0F" stroke="rgba(244,236,221,0.18)"/>
      <text x="46" y="5" text-anchor="middle" font-family="JetBrains Mono" font-size="11" fill="#F4ECDD" letter-spacing="0.04em">Дашборд</text>
    </g>
    <g data-i="3" transform="translate(1655, 410)">
      <rect x="0" y="-16" width="92" height="32" rx="16" fill="#0F0F0F" stroke="rgba(244,236,221,0.18)"/>
      <text x="46" y="5" text-anchor="middle" font-family="JetBrains Mono" font-size="11" fill="#F4ECDD" letter-spacing="0.04em">SMS</text>
    </g>
    <g data-i="4" transform="translate(1655, 490)">
      <rect x="0" y="-16" width="92" height="32" rx="16" fill="#0F0F0F" stroke="rgba(244,236,221,0.18)"/>
      <text x="46" y="5" text-anchor="middle" font-family="JetBrains Mono" font-size="11" fill="#F4ECDD" letter-spacing="0.04em">Аналитика</text>
    </g>
    <g data-i="5" transform="translate(1655, 580)">
      <rect x="0" y="-16" width="92" height="32" rx="16" fill="#0F0F0F" stroke="rgba(244,236,221,0.18)"/>
      <text x="46" y="5" text-anchor="middle" font-family="JetBrains Mono" font-size="11" fill="#F4ECDD" letter-spacing="0.04em">Экспорт</text>
    </g>
    <g data-i="6" transform="translate(1655, 660)">
      <rect x="0" y="-16" width="92" height="32" rx="16" fill="#0F0F0F" stroke="rgba(244,236,221,0.18)"/>
      <text x="46" y="5" text-anchor="middle" font-family="JetBrains Mono" font-size="11" fill="#F4ECDD" letter-spacing="0.04em">База</text>
    </g>
    <g data-i="7" transform="translate(1655, 750)">
      <rect x="0" y="-16" width="100" height="32" rx="16" fill="#0F0F0F" stroke="rgba(244,236,221,0.18)"/>
      <text x="50" y="5" text-anchor="middle" font-family="JetBrains Mono" font-size="10.5" fill="#F4ECDD" letter-spacing="0.04em">Уведомление</text>
    </g>
    <g data-i="8" transform="translate(1655, 840)">
      <rect x="0" y="-16" width="92" height="32" rx="16" fill="#0F0F0F" stroke="rgba(244,236,221,0.18)"/>
      <text x="46" y="5" text-anchor="middle" font-family="JetBrains Mono" font-size="11" fill="#F4ECDD" letter-spacing="0.04em">Статистика</text>
    </g>
    <g data-i="9" transform="translate(1655, 930)">
      <rect x="0" y="-16" width="92" height="32" rx="16" fill="#0F0F0F" stroke="rgba(244,236,221,0.18)"/>
      <text x="46" y="5" text-anchor="middle" font-family="JetBrains Mono" font-size="11" fill="#F4ECDD" letter-spacing="0.04em">Архив</text>
    </g>
  </g>

  <!-- Curve particles container — script populates -->
  <g id="curve-particles"></g>
</svg>

<!-- LAYER 3: DOM overlay (slogan, CTA, mono corner labels) -->
<header class="hero-nav">
  <a class="logo" href="../">
    <svg viewBox="0 0 26 26"><path d="M2 0 L9 0 L18 13 L9 26 L2 26 L11 13 Z M11 0 L18 0 L26 13 L18 26 L11 26 L20 13 Z" fill="currentColor"/></svg>

  </a>
  <nav>

</header>

<div class="corners">
  <span class="c-tl">HYPERPARTNER</span>
  <span class="c-tr">ENTERPRISE · AI/RPA</span>
  <span class="c-bl">CHAOS TO ORDER</span>
  <span class="c-br">v1 · WebGL+SVG · 2026</span>
</div>

<section class="hero-text">
  <div class="eyebrow"><span class="dot"></span> 7 042 ассистента сейчас в работе</div>
  <h1 class="h1">
    <span class="thin">Хаос на входе.</span>

  </h1>
  <div class="cta">

  </div>
</section>

</body>
</html>
